name: Refresh job feeds

# Runs daily in the cloud — no local machine needed. Pair with Vercel
# auto-deploy on push so listings refresh without manual steps.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC = 07:47 IST
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch job feeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run ingest

      - name: Commit refreshed listings
        run: |
          git config user.name "ladder-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/feed-jobs.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore: refresh job feeds $(date -u +%F)"
            git push
          fi
